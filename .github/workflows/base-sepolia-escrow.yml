name: Probon Base Sepolia escrow

on:
  push:
    branches: [base-sepolia-usdc-migration]
    paths:
      - "contracts/**"
      - "test/**"
      - "foundry.toml"
      - ".github/workflows/base-sepolia-escrow.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "foundry.toml"
      - ".github/workflows/base-sepolia-escrow.yml"
  workflow_dispatch:
    inputs:
      deploy_testnet:
        description: 'Type DEPLOY to deploy the tested contract to Base Sepolia'
        required: true
        type: string
      usdc_address:
        description: 'Base Sepolia USDC address'
        required: true
        default: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
        type: string
      fee_recipient:
        description: 'Platform fee recipient wallet'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: probon-base-sepolia-escrow
  cancel-in-progress: false

jobs:
  test:
    name: Compile and test USDC escrow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        run: forge build --sizes
      - name: Run contract tests
        run: forge test -vvv

  deploy:
    name: Deploy to Base Sepolia
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_testnet == 'DEPLOY'
    needs: test
    runs-on: ubuntu-latest
    environment: base-sepolia
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Validate deployment settings
        env:
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          EXPECTED_DEPLOYER_ADDRESS: ${{ secrets.EXPECTED_DEPLOYER_ADDRESS }}
          USDC_ADDRESS: ${{ inputs.usdc_address }}
          FEE_RECIPIENT: ${{ inputs.fee_recipient }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_PRIVATE_KEY" || (echo "::error::Add DEPLOYER_PRIVATE_KEY as an Actions secret"; exit 1)
          test -n "$EXPECTED_DEPLOYER_ADDRESS" || (echo "::error::Add EXPECTED_DEPLOYER_ADDRESS as an Actions secret"; exit 1)
          [[ "$EXPECTED_DEPLOYER_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || (echo "::error::EXPECTED_DEPLOYER_ADDRESS must be a valid EVM address"; exit 1)
          [[ "$USDC_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || (echo "::error::USDC_ADDRESS must be a valid EVM address"; exit 1)
          [[ "$FEE_RECIPIENT" =~ ^0x[0-9a-fA-F]{40}$ ]] || (echo "::error::Fee recipient must be a valid EVM address"; exit 1)
          CHAIN_ID=$(cast chain-id --rpc-url "$BASE_SEPOLIA_RPC_URL")
          [[ "$CHAIN_ID" == "84532" ]] || (echo "::error::RPC is on chain $CHAIN_ID, expected Base Sepolia chain ID 84532"; exit 1)
          DEPLOYER=$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")
          [[ "${DEPLOYER,,}" == "${EXPECTED_DEPLOYER_ADDRESS,,}" ]] || (echo "::error::Private key does not match EXPECTED_DEPLOYER_ADDRESS"; exit 1)
          BALANCE=$(cast balance "$DEPLOYER" --rpc-url "$BASE_SEPOLIA_RPC_URL")
          echo "Deploying from $DEPLOYER on Base Sepolia (chain $CHAIN_ID)"
          echo "Deployer test ETH balance (wei): $BALANCE"
          [[ "$BALANCE" != "0" ]] || (echo "::error::Deployment wallet has zero test ETH; fund it for gas"; exit 1)
      - name: Deploy escrow
        id: deploy
        env:
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          USDC_ADDRESS: ${{ inputs.usdc_address }}
          FEE_RECIPIENT: ${{ inputs.fee_recipient }}
        run: |
          set -euo pipefail
          forge create contracts/ProbonEscrow.sol:ProbonEscrow \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --private-key "$DEPLOYER_PRIVATE_KEY" \
            --broadcast \
            --json \
            --constructor-args "$USDC_ADDRESS" "$FEE_RECIPIENT" | tee deployment.json
          ADDRESS=$(jq -r '.deployedTo // .deployed_to // empty' deployment.json)
          TX=$(jq -r '.transactionHash // .transaction_hash // empty' deployment.json)
          if [[ ! "$ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not parse deployed contract address; inspect deployment artifact."
            cat deployment.json
            exit 1
          fi
          echo "contract_address=$ADDRESS" >> "$GITHUB_OUTPUT"
          echo "transaction_hash=$TX" >> "$GITHUB_OUTPUT"
          echo "## Probon Base Sepolia deployment" >> "$GITHUB_STEP_SUMMARY"
          printf '- Contract: %s\n' "$ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          printf '- Transaction: %s\n' "$TX" >> "$GITHUB_STEP_SUMMARY"
          printf '- Chain ID: 84532\n' >> "$GITHUB_STEP_SUMMARY"
          printf '- USDC: %s\n' "$USDC_ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          printf '- Fee recipient: %s\n' "$FEE_RECIPIENT" >> "$GITHUB_STEP_SUMMARY"
      - name: Save deployment details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probon-base-sepolia-deployment
          path: deployment.json
          if-no-files-found: ignore
          retention-days: 90
